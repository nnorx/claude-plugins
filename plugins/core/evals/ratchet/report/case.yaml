schema_version: "1.1"
name: ratchet-report
description: Two enforced ratchets with slack. Must measure both, report recorded against measured, and change nothing.
tags: [ratchet]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: Look for ratchets in this repo and tell me where they stand.
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Bash, Read, Edit, Write, Glob, Grep, Skill]
runs: 3
graders:
  - type: regex
    name: thresholds unchanged
    target: {source: file, path: packages/web/package.json}
    pattern: "--test-coverage-lines=70 --test-coverage-branches=60 --test-coverage-functions=75"
  - type: regex
    name: baseline unchanged
    target: {source: file, path: packages/web/legacy-api-baseline.json}
    pattern: "\"src/pages/Checkout.tsx\": 2"
  # One claim per judge. A single four-part rubric lost runs to the Haiku
  # judge even when every part was right.
  - type: llm
    name: coverage recorded against measured
    criteria: |
      Pass if the final message gives the coverage thresholds from the test:coverage script with the
      measured value next to each: lines 70 vs 80.95, branches 60 vs 66.67, functions 75 vs 80.
      Rounding to one decimal, or proposing rounded-down values, is fine.
  - type: llm
    name: baseline slack entry by entry
    criteria: |
      Pass if the final message shows that legacy-api-baseline.json has slack in these three entries:
      src/api/client.ts (3 recorded, 2 now), src/pages/Account.tsx (1 recorded, 0 now), and
      src/pages/Checkout.tsx (file deleted). A table is fine. Other correct details are fine.
  - type: llm
    name: says both are enforced
    criteria: |
      Pass if the final message says both checks run in CI as blocking steps, or equivalently that
      neither is non-blocking. Noting that branch protection could not be checked is fine.
  - type: llm
    name: asks before changing
    criteria: |
      Pass if the final message proposes tightening and asks before doing it, and does not say it has
      already changed any file.
  - type: tool_used
    name: skill fired
    tool: Skill
    input_match: ratchet
