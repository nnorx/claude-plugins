schema_version: "1.1"
name: ratchet-no-fire
description: A question about one script in a repo full of ratchets. Must answer it without an audit.
tags: [ratchet, negative]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: What does packages/web/scripts/check-legacy-api.mjs do?
  max_turns: 15
  timeout_seconds: 300
  allowed_tools: [Bash, Read, Glob, Grep, Skill]
runs: 3
graders:
  - type: tool_used
    name: skill did not fire
    tool: Skill
    input_match: ratchet
    min: 0
    max: 0
    arm: both
    weight: 2
  - type: regex
    name: baseline unchanged
    target: {source: file, path: packages/web/legacy-api-baseline.json}
    pattern: "\"src/pages/Checkout.tsx\": 2"
  - type: llm
    name: explains the script
    criteria: |
      The final message explains that the script counts legacyFetch calls per file under src, fails when a
      file has more than legacy-api-baseline.json allows, and rewrites the baseline when run with --update.
      The explanation of the script must come first and be complete. A short note afterwards that the
      baseline has slack is fine. Fail only if the explanation is wrong or missing pieces, or the answer
      becomes mainly an audit of the repo's ratchets.
