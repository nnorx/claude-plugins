schema_version: "1.1"
name: rebase-clean
description: No overlapping files. Must fetch, rebase onto the fresh origin/main, and report before and after SHAs.
tags: [rebase]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: Rebase my branch onto main.
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Bash, Read, Edit, Write, Glob, Grep, Skill]
runs: 3
# 32b602a is upstream's "Start a changelog", reachable only after a fetch.
graders:
  - type: regex
    name: rebased onto fetched upstream
    target: {source: file, path: .git/logs/HEAD}
    pattern: "^[0-9a-f]{40} 32b602abb26821254c96928925547bcaa0904858 .*\\(start\\)"
    flags: m
    weight: 2
  - type: regex
    name: rebase finished
    target: {source: file, path: .git/logs/HEAD}
    pattern: "\\(finish\\): returning to refs/heads/feature"
  - type: regex
    name: reports pre-rebase SHA
    target: last_message
    pattern: "eabc59e"
  - type: tool_used
    name: skill fired
    tool: Skill
    input_match: rebase
