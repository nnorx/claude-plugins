schema_version: "1.1"
name: rebase-trivial
description: Both sides append to the same list. Must keep both entries and finish without stopping to ask.
tags: [rebase, conflict]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: Rebase my branch onto main.
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Bash, Read, Edit, Write, Glob, Grep, Skill]
runs: 3
graders:
  - type: regex
    name: rebase finished
    target: {source: file, path: .git/logs/HEAD}
    pattern: "\\(finish\\): returning to refs/heads/feature"
    weight: 2
  - type: regex
    name: rebased onto fetched upstream
    target: {source: file, path: .git/logs/HEAD}
    pattern: "^[0-9a-f]{40} eb18a47795259d152d4c466a3cc4fff40b010d56 .*\\(start\\)"
    flags: m
  - type: regex
    name: kept upstream entry
    target: {source: file, path: services.yaml}
    pattern: "^  - worker$"
    flags: m
  - type: regex
    name: kept branch entry
    target: {source: file, path: services.yaml}
    pattern: "^  - search$"
    flags: m
  - type: regex
    name: no conflict markers left
    target: {source: file, path: services.yaml}
    pattern: "^(<{7}|={7}|>{7}|\\|{7})"
    flags: m
    match: not_contains
  - type: tool_used
    name: skill fired
    tool: Skill
    input_match: rebase
