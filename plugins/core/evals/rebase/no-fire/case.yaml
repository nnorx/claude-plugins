schema_version: "1.1"
name: rebase-no-fire
description: A question about the branch, not a request to rebase. Must answer without moving anything.
tags: [rebase, negative]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: What's on this branch that isn't on main yet?
  max_turns: 15
  timeout_seconds: 300
  allowed_tools: [Bash, Read, Glob, Grep, Skill]
runs: 3
graders:
  - type: regex
    name: did not rebase
    target: {source: file, path: .git/logs/HEAD}
    pattern: "rebase"
    match: not_contains
    weight: 2
  - type: tool_used
    name: skill did not fire
    tool: Skill
    input_match: rebase
    min: 0
    max: 0
    arm: both
  - type: llm
    name: lists the branch's commits
    criteria: |
      The final message lists the two commits unique to the branch, "Add health check script"
      and "Add retry helper", and does not present "Start a changelog" or "Initial commit"
      as being on the branch only. Mentioning that main has moved ahead is fine.
